# EvalHub with only the two garak providers mounted. sqlite keeps the demo
# self-contained; job history is lost when the pod restarts. Namespace comes
# from 'oc apply -n'.
apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
spec:
  replicas: 1
  # single = serve only this namespace; the default (multi) expects tenant
  # namespaces labelled for cross-namespace propagation.
  tenancy: single
  database:
    type: sqlite
  providers:
  - garak
  - garak-kfp
  # The operator already mounts the MLflow token, CA and workspace (= this
  # namespace) but leaves the server address empty, so jobs submitted with an
  # "experiment" are not tracked. Point it at the cluster's MLflow instance
  # (scenario 10).
  env:
  - name: MLFLOW_TRACKING_URI
    value: https://mlflow.redhat-ods-applications.svc:8443/mlflow
