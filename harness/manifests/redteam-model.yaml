# Scan target for scenario 5: a small open model behind vLLM, so the one
# A10G in the sandbox is enough and a garak run finishes in demo time.
# Runtime image/command are the cluster's own vllm-cuda-runtime-template
# (RHOAI 3.5.1). Namespace comes from 'oc apply -n'.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: redteam-vllm-runtime
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
  - name: kserve-container
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
    command: [python, -m, vllm.entrypoints.openai.api_server]
    args:
    - --port=8080
    - --model=/mnt/models
    - --served-model-name={{.Name}}
    - --max-model-len=8192
    - --gpu-memory-utilization=0.85
    env:
    - name: HF_HOME
      value: /tmp/hf_home
    ports:
    - containerPort: 8080
      protocol: TCP
  multiModel: false
  supportedModelFormats:
  - name: vLLM
    autoSelect: true
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: redteam-target
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Red teaming target (Qwen2.5-1.5B-Instruct)
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: redteam-vllm-runtime
      storageUri: hf://Qwen/Qwen2.5-1.5B-Instruct
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "3"
          memory: 8Gi
          nvidia.com/gpu: "1"
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
