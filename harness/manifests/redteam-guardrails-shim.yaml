# Scenario 9: a thin adapter between garak and the guardrails gateway.
# When a detector blocks a request, the gateway answers 200 with an empty
# "choices" list plus the detections. garak treats that as a broken
# generator, aborts the scan, and EvalHub then reports attack success rate 0
# ("pass") -- a false pass. This adapter turns a blocked response into an
# ordinary refusal so garak scores it as a failed attack. Everything else is
# passed through unchanged. Namespace comes from 'oc apply -n'.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-refusal-shim
data:
  shim.py: |
    import json, os, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM = os.environ["UPSTREAM"].rstrip("/")

    class Handler(BaseHTTPRequestHandler):
        def _forward(self, body=None):
            req = urllib.request.Request(UPSTREAM + self.path, data=body, method=self.command,
                                         headers={"Content-Type": "application/json"})
            try:
                with urllib.request.urlopen(req, timeout=300) as r:
                    return r.status, r.read()
            except urllib.error.HTTPError as e:
                return e.code, e.read()

        def _reply(self, status, payload):
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            self._reply(*self._forward())

        def do_POST(self):
            status, payload = self._forward(self.rfile.read(int(self.headers.get("Content-Length", 0))))
            if status == 200 and self.path.endswith("/chat/completions"):
                data = json.loads(payload)
                if not data.get("choices") and data.get("detections"):
                    found = sorted({r.get("detector_id", "?")
                                    for side in ("input", "output")
                                    for m in (data["detections"].get(side) or [])
                                    for r in m.get("results", [])})
                    data["choices"] = [{"index": 0, "finish_reason": "stop", "message": {
                        "role": "assistant",
                        # Worded so garak's refusal detector
                        # (mitigation.MitigationBypass) recognises it; "I can't
                        # help with that" was scored as a successful attack.
                        "content": "I'm sorry, but I cannot assist with that request. [blocked by guardrails: %s]" % ", ".join(found)}}]
                    payload = json.dumps(data).encode()
            self._reply(status, payload)

        def log_message(self, fmt, *args):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-refusal-shim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardrails-refusal-shim
  template:
    metadata:
      labels:
        app: guardrails-refusal-shim
    spec:
      containers:
      - name: shim
        image: registry.access.redhat.com/ubi9/python-312:latest
        command: [python, /shim/shim.py]
        env:
        - name: UPSTREAM
          value: http://guardrails-service:8090
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: shim
          mountPath: /shim
      volumes:
      - name: shim
        configMap:
          name: guardrails-refusal-shim
---
apiVersion: v1
kind: Service
metadata:
  name: guardrails-refusal-shim
spec:
  selector:
    app: guardrails-refusal-shim
  ports:
  - name: http
    port: 8080
    targetPort: 8080
